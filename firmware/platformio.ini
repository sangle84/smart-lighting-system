[platformio]
default_envs = blink

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    claws/BH1750
    adafruit/Adafruit INA219

[env:blink]
build_flags = -D TEST_MODE_BLINK

[env:i2cscan]
build_flags = -D TEST_MODE_I2C_SCAN

[env:sensors]
build_flags = -D TEST_MODE_SENSORS

[env:pwmtest]
build_src_filter =
    -<*>
    +<pwmtest.cpp>

[env:bhtest]
build_src_filter =
    -<*>
    +<bh1750_test.cpp>

[env:ina219test]
build_src_filter =
    -<*>
    +<ina219_test.cpp>

[env:rcwltest]
build_src_filter =
    -<*>
    +<rcwl_test.cpp>
